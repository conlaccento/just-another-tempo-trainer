[package]
name = "just-another-tempo-trainer"
version = "1.0.1"
description = "Slow down songs to practice, without changing pitch"
authors = ["Just another Tempo Trainer contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "just_another_tempo_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
