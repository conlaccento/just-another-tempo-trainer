name: Release

# Push a tag like v0.2.0 to build the Windows and macOS installers and attach them
# to a draft GitHub release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tempo Trainer ${{ github.ref_name }}
          releaseBody: |
            Downloads: `.dmg` for macOS (`aarch64` = Apple Silicon, `x64` = Intel), `.exe` or `.msi` for Windows.
            The app is not signed: see the README for how to open it the first time.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
