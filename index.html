<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Just another Tempo Trainer</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="app-header">
      <svg class="logo" viewBox="0 0 120 40" aria-hidden="true" focusable="false">
        <polygon class="logo-triangle" points="2,38 20,4 38,38" />
        <rect class="logo-square" x="44" y="4" width="34" height="34" />
        <circle class="logo-circle" cx="101" cy="21" r="17" />
      </svg>
      <div class="app-title">
        <h1><span class="title-pre">Just another</span> Tempo Trainer</h1>
        <p id="fileName" class="file-name"></p>
      </div>
      <button id="openBtn" class="secondary" type="button" data-i18n="open"></button>
      <input id="fileInput" type="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.opus" hidden />
    </header>

    <main>
      <section id="drop" class="drop">
        <div class="drop-inner">
          <svg class="drop-mark" viewBox="0 0 120 40" aria-hidden="true" focusable="false">
            <polygon class="logo-triangle" points="2,38 20,4 38,38" />
            <rect class="logo-square" x="44" y="4" width="34" height="34" />
            <circle class="logo-circle" cx="101" cy="21" r="17" />
          </svg>
          <p class="drop-title" data-i18n="dropTitle"></p>
          <p><span data-i18n="dropOr"></span> <button id="chooseBtn" class="link-button" type="button" data-i18n="choose"></button></p>
          <p class="muted small" data-i18n="dropFormats"></p>
          <p id="dropStatus" class="drop-status" role="status"></p>
        </div>
      </section>

      <section id="player" class="player" hidden>
        <div class="wave-wrap">
          <canvas id="wave" class="wave"></canvas>
          <div class="wave-meta">
            <span class="time"><span id="cur" class="mono">0:00.0</span> / <span id="dur" class="mono">0:00</span></span>
            <span class="muted small" data-i18n="loopHint"></span>
          </div>
        </div>

        <div class="transport">
          <div class="group">
            <button id="startBtn" class="icon-btn" type="button" data-i18n-title="toStart"><svg viewBox="0 0 24 24"><path d="M5 5h3v14H5zM20 5 9 12l11 7z" fill="currentColor"/></svg></button>
            <button id="backBtn" class="icon-btn" type="button" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M12 6 3 12l9 6zM21 6l-9 6 9 6z" fill="currentColor"/></svg></button>
            <button id="playBtn" class="play-btn" type="button" data-i18n-title="play">
              <svg class="i-play" viewBox="0 0 24 24"><path d="M6 4v16l14-8z" fill="currentColor"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24"><path d="M5 4h5v16H5zM14 4h5v16h-5z" fill="currentColor"/></svg>
            </button>
            <button id="fwdBtn" class="icon-btn" type="button" data-i18n-title="forward"><svg viewBox="0 0 24 24"><path d="m12 6 9 6-9 6zM3 6l9 6-9 6z" fill="currentColor"/></svg></button>
          </div>
          <div class="group loop-group" role="group" data-i18n-aria="loop">
            <span class="label" data-i18n="loop"></span>
            <button id="setABtn" class="secondary small" type="button" data-i18n="setA"></button>
            <button id="setBBtn" class="secondary small" type="button" data-i18n="setB"></button>
            <button id="loopBtn" class="secondary small toggle" type="button" aria-pressed="false" data-i18n="loopOn"></button>
            <button id="clearLoopBtn" class="link-button" type="button" data-i18n="clearLoop"></button>
          </div>
        </div>

        <div class="panels">
          <section class="panel tempo-panel" aria-labelledby="tempoTitle">
            <h2 id="tempoTitle" class="heading heading-square" data-i18n="tempoTitle"></h2>
            <div class="bpm-pair">
              <div class="bpm-box">
                <label for="origInput" class="label" data-i18n="original"></label>
                <input id="origInput" class="bpm-input" type="number" min="20" max="400" step="1" inputmode="numeric" data-i18n-title="editHint" />
                <div class="bpm-tools">
                  <button id="halfBtn" class="secondary small" type="button" data-i18n-title="half">÷2</button>
                  <button id="doubleBtn" class="secondary small" type="button" data-i18n-title="double">×2</button>
                  <button id="tapBtn" class="secondary small" type="button" data-i18n="tap" data-i18n-title="tapHint"></button>
                </div>
                <p id="bpmStatus" class="bpm-status small" role="status"></p>
              </div>
              <div class="bpm-box main">
                <label for="targetInput" class="label" data-i18n="target"></label>
                <input id="targetInput" class="bpm-input big" type="number" min="5" max="600" step="1" inputmode="numeric" />
                <div class="bpm-tools">
                  <button id="targetDown" class="secondary small step" type="button" aria-label="−1 BPM">−</button>
                  <button id="targetUp" class="secondary small step" type="button" aria-label="+1 BPM">+</button>
                </div>
              </div>
            </div>
            <div class="speed-row">
              <label for="speedRange" class="label" data-i18n="speed"></label>
              <input id="speedRange" type="range" min="25" max="150" step="1" value="100" />
              <output id="speedOut" class="mono" for="speedRange" aria-live="off">100%</output>
            </div>
            <div id="presets" class="presets"></div>
          </section>

          <div class="side">
            <section class="panel" aria-labelledby="soundTitle">
              <h2 id="soundTitle" class="heading heading-circle" data-i18n="soundTitle"></h2>
              <div class="row">
                <span class="label" data-i18n="transpose"></span>
                <button id="pitchDown" class="secondary small step" type="button" aria-label="−1">−</button>
                <output id="pitchOut" class="mono pitch-out" aria-live="off">0</output>
                <button id="pitchUp" class="secondary small step" type="button" aria-label="+1">+</button>
                <span class="muted small" data-i18n="semitones"></span>
              </div>
            </section>

            <section class="panel shortcuts" aria-labelledby="shortcutsTitle">
              <h2 id="shortcutsTitle" class="heading heading-triangle" data-i18n="shortcuts"></h2>
              <dl>
                <dt><kbd>Space</kbd></dt><dd data-i18n="scSpace"></dd>
                <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd data-i18n="scArrows"></dd>
                <dt><kbd>↑</kbd> <kbd>↓</kbd></dt><dd data-i18n="scUpDown"></dd>
                <dt><kbd>A</kbd> <kbd>B</kbd></dt><dd data-i18n="scAB"></dd>
                <dt><kbd>L</kbd></dt><dd data-i18n="scL"></dd>
                <dt><kbd>T</kbd></dt><dd data-i18n="scT"></dd>
                <dt><kbd>Home</kbd></dt><dd data-i18n="scHome"></dd>
              </dl>
            </section>
          </div>
        </div>
      </section>
    </main>
    <div id="dropOverlay" class="drop-overlay" hidden><span data-i18n="dropTitle"></span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
